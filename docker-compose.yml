services:
  postgres-master:
    image: postgres:16
    container_name: postgres-master
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - master_data:/var/lib/postgresql/data
      - ./postgres-master.conf:/etc/primary/postgresql.conf
      - ./pg_hba.conf:/etc/primary/pg_hba.conf
      - ./init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c config_file=/etc/primary/postgresql.conf
        -c hba_file=/etc/primary/pg_hba.conf
    networks:
      - flashsale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 0.0.0.0 -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    environment:
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./postgres-replica.conf:/etc/replica/postgresql.conf
      - ./init-replica.sh:/init-replica.sh
    entrypoint: /bin/bash /init-replica.sh
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - flashsale

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - flashsale

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - flashsale

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - flashsale

volumes:
  master_data:
  replica_data:
  prometheus_data:
  grafana_data:

networks:
  flashsale:
    driver: bridge
