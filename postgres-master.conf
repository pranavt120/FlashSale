# Allow connections from all network interfaces for Docker networking
listen_addresses = '*'

# Replication settings
wal_level = replica
max_wal_senders = 3
max_replication_slots = 3
wal_keep_size = '1GB'

# Commit behavior
synchronous_commit = off

# Performance tuning
max_connections = 500
shared_buffers = 256MB
work_mem = 10MB
checkpoint_completion_target = 0.9

# Logging
log_replication_commands = on
